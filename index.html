<style>
:root{--emer:#1C5B4E;--emer2:#2FB78F;--gold:#CBA75A;--ink:#F3F0EA;--dark:#0f1c17}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:16px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(120% 100% at 50% 0%,#14261f,#0b1512);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;
  -webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:none}
.logo{width:64px;height:64px;background:var(--gold);transform:rotate(45deg);border-radius:14px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(203,167,90,.25)}
.logo span{transform:rotate(-45deg);color:var(--dark);font-weight:800;font-size:32px}
h1{font-size:clamp(30px,7vw,46px);letter-spacing:-1px;margin:20px 0 6px}
.tag{color:#9fbcb2;font-size:15px;margin-bottom:22px;text-align:center}
.stage{position:relative;touch-action:none}
canvas{display:block;border-radius:18px;background:rgba(255,255,255,.04);
  border:1px solid rgba(47,183,143,.22);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hud{display:flex;justify-content:space-between;width:100%;max-width:420px;margin:12px auto 0;
  color:#9fbcb2;font-size:14px;letter-spacing:.3px}
.hud b{color:var(--ink)}
.hud .gold{color:var(--gold)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;border-radius:18px;background:rgba(9,17,14,.72);backdrop-filter:blur(2px);
  cursor:pointer;user-select:none}
.overlay.hide{display:none}
.overlay h2{font-size:22px;margin-bottom:6px}
.overlay p{color:#b7ccc4;font-size:14px;max-width:260px}
.overlay .go{margin-top:16px;background:var(--emer2);color:var(--dark);font-weight:700;
  padding:12px 26px;border-radius:99px;font-size:15px;box-shadow:0 10px 30px rgba(47,183,143,.3)}
.hint{color:#7f978e;font-size:12.5px;margin-top:14px;text-align:center}
.foot{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#5f746c;font-size:12px}
.foot a{color:#7f978e;text-decoration:none;margin:0 8px}
.foot a:hover{color:#CFE9E0}
</style></head>
<body>
<div class="logo"><span>L</span></div>
<h1>Logosell</h1>
<p class="tag">Something good is on its way. ◆</p>

<div class="stage">
  <canvas id="game" width="420" height="420" aria-label="Snake mini-game"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="ov-title">Snake</h2>
    <p id="ov-text">While you wait — a little game.<br>Arrows / WASD, or swipe.</p>
    <div class="go" id="ov-btn">Play</div>
  </div>
</div>
<div class="hud"><span>Length <b id="len">1</b></span><span>Best <b class="gold" id="best">0</b></span></div>
<p class="hint">Collect the ◆. Pass through the walls — just don't bite yourself.</p>

<div class="foot">
  © 2026 Logosell · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a>
</div>

<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovText = document.getElementById('ov-text');
  var ovBtn = document.getElementById('ov-btn');
  var lenEl = document.getElementById('len');
  var bestEl = document.getElementById('best');

  var GRID = 17;                 // cells per side
  var BEST_KEY = 'logosell_snake_best';
  var best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
  bestEl.textContent = best;

  // Responsive, crisp canvas sized to the viewport.
  var cell = 22;
  function resize() {
    var max = Math.min(window.innerWidth - 36, window.innerHeight - 300, 460);
    max = Math.max(220, max);
    cell = Math.floor(max / GRID);
    var px = cell * GRID;
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = px + 'px';
    canvas.style.height = px + 'px';
    canvas.width = px * dpr;
    canvas.height = px * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  var snake, dir, nextDir, food, alive = false, tickMs, acc = 0, last = 0, raf = 0;

  function reset() {
    snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    placeFood();
    tickMs = 175;               // slower start (higher = slower)
    acc = 0;
    lenEl.textContent = snake.length;
  }

  function placeFood() {
    do {
      food = { x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0 };
    } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }

  function start() {
    reset();
    alive = true;
    overlay.classList.add('hide');
    last = performance.now();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function gameOver() {
    alive = false;
    if (snake.length > best) { best = snake.length; localStorage.setItem(BEST_KEY, best); bestEl.textContent = best; }
    ovTitle.textContent = 'Game over';
    ovText.innerHTML = 'Length <b>' + snake.length + '</b> · Best <b>' + best + '</b>';
    ovBtn.textContent = 'Play again';
    overlay.classList.remove('hide');
  }

  function step() {
    dir = nextDir;
    // walls wrap around — pass straight through to the opposite side
    var head = { x: (snake[0].x + dir.x + GRID) % GRID, y: (snake[0].y + dir.y + GRID) % GRID };
    // self
    for (var i = 0; i < snake.length; i++) if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      placeFood();
      if (tickMs > 110) tickMs -= 2;        // speed up very gently, and never too fast
      lenEl.textContent = snake.length;
    } else {
      snake.pop();
    }
  }

  function loop(now) {
    if (!alive) return;
    acc += now - last; last = now;
    while (acc >= tickMs) { acc -= tickMs; step(); if (!alive) { draw(); return; } }
    draw();
    raf = requestAnimationFrame(loop);
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    var px = cell * GRID;
    ctx.clearRect(0, 0, px, px);
    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, px); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(px, i * cell); ctx.stroke();
    }
    // food — emerald gem
    if (food) {
      var fx = food.x * cell + cell / 2, fy = food.y * cell + cell / 2, s = cell * 0.30;
      ctx.save();
      ctx.shadowColor = 'rgba(47,183,143,.8)'; ctx.shadowBlur = cell * 0.5;
      ctx.fillStyle = '#2FB78F';
      ctx.beginPath();
      ctx.moveTo(fx, fy - s); ctx.lineTo(fx + s, fy); ctx.lineTo(fx, fy + s); ctx.lineTo(fx - s, fy);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // snake — gold body, brighter head
    for (var j = snake.length - 1; j >= 0; j--) {
      var seg = snake[j], pad = Math.max(1, cell * 0.10);
      var t = j / Math.max(1, snake.length - 1); // 0 head .. 1 tail
      if (j === 0) ctx.fillStyle = '#EAD79A';
      else {
        var g = Math.round(203 - t * 60), b2 = Math.round(90 + t * 20);
        ctx.fillStyle = 'rgb(' + (203 - Math.round(t * 30)) + ',' + g + ',' + b2 + ')';
      }
      rr(seg.x * cell + pad, seg.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      ctx.fill();
    }
  }

  // ---- input ----
  function turn(x, y) {
    if (!alive) return;
    if (x === -dir.x && y === -dir.y) return; // no reversing
    if (x === dir.x && y === dir.y) return;
    nextDir = { x: x, y: y };
  }
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { turn(0, -1); e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { turn(0, 1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { turn(-1, 0); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { turn(1, 0); e.preventDefault(); }
    else if ((k === ' ' || k === 'Enter') && !alive) { start(); }
  }, { passive: false });

  // swipe
  var tsx = 0, tsy = 0, tracking = false;
  canvas.addEventListener('touchstart', function (e) { var t = e.touches[0]; tsx = t.clientX; tsy = t.clientY; tracking = true; }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    if (!tracking) return;
    var t = e.touches[0], dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Math.abs(dx) > 24 || Math.abs(dy) > 24) {
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
      else turn(0, dy > 0 ? 1 : -1);
      tracking = false;
    }
  }, { passive: true });

  overlay.addEventListener('click', start);

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (alive) cancelAnimationFrame(raf); }
    else if (alive) { last = performance.now(); raf = requestAnimationFrame(loop); }
  });

  reset();
  resize();
})();
</script>
</body></html>
